name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # verify の中身は package.json で書き換えられるため、ゲートの改ざん検査は verify とは別に直接実行する。
      - run: bun packages/ai-profile/gate/check.mjs
      - run: bun run verify
